<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20aaa8"><title>寝室电费监控</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
:root{
  --brand:#1fb6b2;
  --brand-dark:#159892;
  --brand-soft:#eaf9f8;
  --navy:#172033;
  --text:#263246;
  --muted:#758091;
  --line:#e7edf2;
  --line-strong:#dce5eb;
  --card:#ffffff;
  --bg:#f3f7fa;
  --bg-2:#edf4f7;
  --red:#e95667;
  --red-soft:#fff1f3;
  --blue:#4e7ff0;
  --blue-soft:#eef4ff;
  --green:#21a26f;
  --green-soft:#ebfaf3;
  --shadow-sm:0 8px 18px rgba(21, 33, 56, .05);
  --shadow-md:0 14px 34px rgba(21, 33, 56, .07);
  --shadow-lg:0 22px 46px rgba(21, 33, 56, .09);
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at top left, rgba(31,182,178,.10), transparent 30%),
    radial-gradient(circle at top right, rgba(78,127,240,.08), transparent 26%),
    linear-gradient(180deg, #f8fbfc 0%, var(--bg) 32%, var(--bg-2) 100%);
}
.hidden{display:none!important}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{outline:none}
.app{
  width:min(1720px, calc(100% - 44px));
  margin:0 auto;
  padding:26px 0 56px;
}

.appbar{
  position:sticky;
  top:14px;
  z-index:20;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:18px 22px;
  border:1px solid rgba(231,237,242,.95);
  border-radius:22px;
  box-shadow:var(--shadow-md);
}
.appbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.app-title{
  font-size:24px;
  font-weight:800;
  color:var(--navy);
  letter-spacing:.2px;
}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line-strong);
  background:#fff;
  color:var(--text);
  border-radius:12px;
  padding:9px 15px;
  font-weight:650;
  transition:all .18s ease;
  box-shadow:0 2px 0 rgba(0,0,0,.015);
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
  border-color:#cfd9e2;
}
.btn.primary{
  background:linear-gradient(135deg, var(--brand) 0%, #2ac4b6 100%);
  border-color:transparent;
  color:#fff;
}
.btn.primary:hover{
  background:linear-gradient(135deg, var(--brand-dark) 0%, #23b9ad 100%);
}
.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  font-size:12px;
  line-height:1;
  padding:7px 11px;
  border-radius:999px;
  background:#e9f8f6;
  color:#137f79;
  font-weight:700;
}
.status.warning{background:#fff3de;color:#9d671f}
.status.error{background:#ffeced;color:#bf4050}
.status.loading{background:#eef3ff;color:#3c6ede}

.school-hero{
  position:relative;
  overflow:hidden;
  margin-top:16px;
  padding:28px 28px 26px;
  background:
    radial-gradient(circle at 92% 12%, rgba(31,182,178,.14), transparent 16%),
    radial-gradient(circle at 82% 34%, rgba(78,127,240,.10), transparent 18%),
    linear-gradient(135deg, #ffffff 0%, #fbfefe 100%);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-md);
}
.school-hero:before{
  content:"";
  position:absolute;
  inset:auto auto 0 0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg, var(--brand) 0%, #55d1c8 60%, #8ad6ff 100%);
}
.balance-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
}
.balance-label{
  font-size:14px;
  color:var(--muted);
  margin-bottom:6px;
}
.balance-big{
  font-size:52px;
  line-height:1;
  font-weight:850;
  color:var(--navy);
  letter-spacing:-1.6px;
}
.balance-big small{
  font-size:18px;
  font-weight:700;
  color:#6a7483;
  margin-left:8px;
}
.updated{
  font-size:14px;
  color:var(--muted);
  text-align:right;
}
.low-balance-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:16px;
  padding:8px 12px;
  border-radius:999px;
  background:var(--red-soft);
  color:#be4151;
  font-size:13px;
  font-weight:700;
  border:1px solid #ffd6dc;
}

.main-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:18px;
  background:#fff;
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:22px 22px 0 0;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.main-tabs button{
  border:0;
  background:#fff;
  color:#4f5a68;
  padding:18px 10px 16px;
  font-size:19px;
  font-weight:800;
  position:relative;
  transition:all .18s ease;
}
.main-tabs button:hover{background:#f8fbfc}
.main-tabs button.active{
  color:var(--brand-dark);
  background:linear-gradient(180deg, rgba(31,182,178,.06), rgba(31,182,178,0));
}
.main-tabs button.active:after{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  bottom:0;
  height:4px;
  border-radius:999px 999px 0 0;
  background:linear-gradient(90deg, var(--brand) 0%, #59d1c6 100%);
}

.school-view{
  background:#fff;
  border:1px solid var(--line);
  border-top:0;
  border-radius:0 0 22px 22px;
  padding:24px 26px 28px;
  box-shadow:var(--shadow-md);
}
.picker-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}
.period-controls{display:flex;align-items:center;gap:10px}
.period-select{
  min-width:158px;
  border:1px solid var(--line-strong);
  background:#fff;
  color:var(--navy);
  border-radius:12px;
  padding:10px 36px 10px 14px;
  font-size:16px;
  font-weight:800;
  outline:none;
  box-shadow:0 1px 0 rgba(0,0,0,.01);
}
.period-select:hover{border-color:#cfd8df}
.period-select:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(31,182,178,.10);
}
.unit-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:46px;
  height:34px;
  padding:0 10px;
  border-radius:999px;
  background:#f3f7f8;
  color:#697482;
  font-size:12px;
  font-weight:800;
  border:1px solid #edf2f5;
}
.segmented,
.tabs{
  display:flex;
  gap:4px;
  padding:4px;
  background:#f3f5f7;
  border-radius:999px;
  border:1px solid #ecf0f3;
}
.segmented button,
.tab{
  border:0;
  background:transparent;
  padding:8px 14px;
  border-radius:999px;
  color:#61707f;
  font-size:14px;
  font-weight:700;
  transition:all .16s ease;
}
.segmented button:hover,
.tab:hover{background:rgba(255,255,255,.72)}
.segmented button.active,
.tab.active{
  background:linear-gradient(135deg, var(--brand) 0%, #2dc6b7 100%);
  color:#fff;
  box-shadow:0 6px 14px rgba(31,182,178,.22);
}

.weekdays,.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
}
.weekdays{
  padding:12px 0 10px;
  text-align:center;
  color:#606c7a;
  font-size:14px;
  font-weight:700;
  border-bottom:1px solid var(--line);
}
.calendar-grid{padding-top:12px}
.cal-day{
  min-height:96px;
  border:1px solid #eef2f5;
  background:linear-gradient(180deg, #fcfdfd 0%, #f8fafb 100%);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .16s ease;
  user-select:none;
  box-shadow:0 1px 0 rgba(0,0,0,.01);
}
.cal-day:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-sm);
  border-color:#dfe8ee;
}
.cal-num{
  font-size:13px;
  color:#7a8492;
}
.cal-day b{
  font-size:18px;
  font-weight:800;
}
.cal-day.max{
  background:linear-gradient(180deg, #fff6f7 0%, #fff1f3 100%);
  border-color:#ffdfe4;
  color:var(--red);
}
.cal-day.min{
  background:linear-gradient(180deg, #f5f8ff 0%, #eef4ff 100%);
  border-color:#dbe6ff;
  color:var(--blue);
}
.cal-day.today{
  background:linear-gradient(180deg, #f2fcfb 0%, #eaf9f8 100%);
  border-color:#d4f1ec;
  color:var(--brand-dark);
}
.calendar-legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:13px;
  color:#68727e;
  margin:18px 0 10px;
}
.legend-dot{
  display:inline-block;
  width:11px;
  height:11px;
  border-radius:4px;
  margin-right:6px;
  vertical-align:-1px;
}
.legend-max{background:#ef5d69}
.legend-min{background:#4e7ff0}
.legend-today{background:var(--brand)}

.month-summary{
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  padding-top:20px;
  margin-top:6px;
}
.summary-item{
  padding:6px 2px;
}
.month-summary .summary-item:last-child{text-align:right}
.summary-value{
  font-size:34px;
  font-weight:850;
  color:var(--navy);
  letter-spacing:-.8px;
}
.summary-label{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.school-chart{
  height:400px;
  margin-top:8px;
  background:linear-gradient(180deg, #fcfdfd 0%, #fbfcfd 100%);
  border:1px solid #eef2f5;
  border-radius:18px;
  padding:14px;
}
.year-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.bill-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:22px;
}
.bill-card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 18px 16px;
  background:linear-gradient(180deg,#fff 0%,#fbfcfd 100%);
  box-shadow:var(--shadow-sm);
}
.bill-card:before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg, rgba(31,182,178,.95), rgba(87,208,197,.7));
}
.bill-month{
  font-weight:800;
  font-size:16px;
  color:var(--navy);
  margin-bottom:15px;
}
.bill-values{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.bill-values>div{
  display:flex;
  flex-direction:column;
}
.bill-values b{
  font-size:26px;
  color:var(--navy);
}
.bill-label{
  color:#7a8491;
  font-size:13px;
  margin-top:5px;
}

.details{
  padding:22px 0 0;
  display:grid;
  gap:16px;
}
.details-title{
  font-size:22px;
  font-weight:850;
  color:var(--navy);
  margin:2px 2px 0;
}
.overview-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.card{
  background:linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow-sm);
}
.overview-card{
  position:relative;
  overflow:hidden;
}
.overview-card:after{
  content:"";
  position:absolute;
  right:-18px;
  top:-18px;
  width:84px;
  height:84px;
  border-radius:50%;
  background:linear-gradient(135deg, rgba(31,182,178,.10), rgba(78,127,240,.04));
}
.overview-card .overview-label{
  position:relative;
  z-index:1;
  color:var(--muted);
  font-size:13px;
}
.overview-value{
  position:relative;
  z-index:1;
  font-size:28px;
  font-weight:850;
  margin-top:10px;
  color:var(--navy);
}
.overview-value span{
  font-size:14px;
  font-weight:700;
  color:#728090;
  margin-left:4px;
}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(380px,.65fr);
  gap:16px;
}
.panel-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:10px;
}
.panel h2{
  font-size:18px;
  color:var(--navy);
  margin:0;
  font-weight:800;
}
.meta-pill{
  font-size:12px;
  color:#697482;
  background:#f3f6f8;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #eef2f5;
}
.chartbox{
  height:320px;
  padding-top:4px;
}
.activity-list{
  display:grid;
  gap:6px;
  max-height:320px;
  overflow:auto;
  padding-right:2px;
}
.activity{
  display:grid;
  grid-template-columns:36px 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #eef2f5;
}
.activity:last-child{border-bottom:0}
.activity-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--blue-soft);
  color:#3d72e4;
  font-size:14px;
}
.activity.recharge .activity-icon{
  background:var(--green-soft);
  color:var(--green);
}
.activity-title{
  font-size:13px;
  font-weight:750;
  color:var(--navy);
}
.activity-time{
  font-size:11px;
  color:#9299a2;
  margin-top:3px;
}
.activity-amount{
  font-weight:800;
  color:var(--navy);
}

.notice{display:none}
.notice.show.error{
  display:block;
  margin:12px 0 0;
  padding:11px 14px;
  border-radius:12px;
  background:#ffeded;
  color:#bd3947;
  font-size:13px;
  border:1px solid #ffd8dd;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(11,18,32,.42);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:30;
}
.modal.show{display:flex}
.modal-card{
  width:min(100%,560px);
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:24px 22px;
  box-shadow:var(--shadow-lg);
}
.modal-title{
  font-weight:850;
  font-size:20px;
  color:var(--navy);
}
.modal-desc{
  color:#677281;
  line-height:1.7;
  margin:9px 0 14px;
}
.field label{
  display:block;
  font-size:13px;
  color:#68727e;
  margin-bottom:6px;
}
.field input{
  width:100%;
  border:1px solid #dfe6eb;
  border-radius:12px;
  padding:12px 13px;
  outline:none;
}
.field input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(31,182,178,.10);
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(12px);
  background:#1d2430;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  box-shadow:var(--shadow-lg);
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#be3d49}
.empty{
  padding:26px;
  text-align:center;
  color:#8d96a1;
}

@media(max-width:1200px){
  .app{width:calc(100% - 28px)}
  .overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:1fr}
  .bill-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .app{
    width:100%;
    padding:0 0 28px;
  }
  .appbar{
    top:0;
    border-radius:0 0 18px 18px;
    border-left:0;
    border-right:0;
    padding:14px 14px 13px;
  }
  .app-title{font-size:19px}
  .school-hero{
    margin-top:0;
    border-radius:0;
    border-left:0;
    border-right:0;
    padding:20px 14px 18px;
  }
  .balance-row{
    flex-direction:column;
    align-items:flex-start;
  }
  .balance-big{font-size:40px}
  .updated{text-align:left;font-size:12px}
  .main-tabs{
    margin-top:10px;
    border-radius:0;
    border-left:0;
    border-right:0;
  }
  .main-tabs button{
    font-size:16px;
    padding:15px 8px 13px;
  }
  .school-view{
    border-radius:0;
    border-left:0;
    border-right:0;
    padding:16px 14px 22px;
  }
  .picker-row{
    align-items:flex-start;
    flex-direction:column;
  }
  .period-select{
    min-width:138px;
    font-size:15px;
  }
  .unit-chip{display:none}
  .weekdays,.calendar-grid{gap:6px}
  .cal-day{
    min-height:66px;
    border-radius:12px;
    gap:5px;
  }
  .cal-day b{font-size:15px}
  .month-summary{
    gap:10px;
  }
  .summary-value{font-size:24px}
  .school-chart{
    height:315px;
    padding:8px;
    border-radius:16px;
  }
  .details{
    padding:14px;
  }
  .details-title{font-size:18px}
  .overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .overview-value{font-size:23px}
  .bill-list{grid-template-columns:1fr}
  .chartbox{height:270px}
}
@media(max-width:430px){
  .actions{gap:8px}
  .btn{padding:8px 12px}
  .segmented button,
  .tab{
    padding:7px 11px;
    font-size:13px;
  }
  .weekdays{font-size:13px}
  .calendar-legend{font-size:12px;gap:12px}
  .card{padding:15px}
  .overview-grid{grid-template-columns:1fr 1fr;gap:8px}
  .bill-values b{font-size:23px}
}
</style></head><body>

<div class="app">
  <header class="appbar">
    <div class="appbar-row">
      <div class="app-title">寝室电费</div>
      <div class="actions">
        <button id="exportBtn" class="btn" type="button">导出</button>
        <button id="refreshBtn" class="btn primary" type="button">刷新数据</button>
      </div>
    </div>
    <div style="margin-top:9px">
      <span id="status" class="status loading">正在读取</span>
    </div>
  </header>

  <section class="school-hero">
    <div class="balance-row">
      <div>
        <div class="balance-label">当前余额</div>
        <div class="balance-big"><span id="schoolBalance">--</span><small>元</small></div>
        <div id="schoolAlert" class="low-balance-badge hidden"></div>
      </div>
      <div id="schoolUpdated" class="updated">等待数据</div>
    </div>
  </section>

  <nav class="main-tabs">
    <button id="dailyMainTab" class="active" type="button">日用电量</button>
    <button id="monthlyMainTab" type="button">月度电费</button>
  </nav>

  <div id="notice" class="notice"></div>

  <section id="dailyView" class="school-view">
    <div class="picker-row">
      <div class="period-controls">
        <select id="monthPicker" class="period-select" aria-label="选择月份"></select>
        <span class="unit-chip">元</span>
      </div>
      <div class="segmented">
        <button id="calendarModeBtn" class="active" type="button">用电日历</button>
        <button id="trendModeBtn" type="button">电量趋势</button>
      </div>
    </div>

    <div id="calendarPanel">
      <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="usageCalendar" class="calendar-grid"></div>

function intervalKey(previous,current){
  return `${previous.id ?? previous.created_at}->${current.id ?? current.created_at}`;

const $ = id => document.getElementById(id);
const money = value => Number.isFinite(Number(value)) ? Number(value).toFixed(2) : "--";

function chinaParts(value){
  const parts = new Intl.DateTimeFormat("zh-CN", {
    timeZone:TZ,
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",
    hourCycle:"h23"
  }).formatToParts(new Date(value));
  const result = {};
  for(const part of parts){
    if(part.type !== "literal") result[part.type] = part.value;
  }
  return result;
}

function dayKey(value){
  const p = chinaParts(value);
  return `${p.year}-${p.month}-${p.day}`;
}

function monthKey(value){
  return dayKey(value).slice(0,7);
}

function cnTime(value, withYear=false){
  return new Intl.DateTimeFormat("zh-CN", {
    timeZone:TZ,
    year:withYear ? "numeric" : undefined,
    month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",
    hourCycle:"h23"
  }).format(new Date(value));
}

function addDaysToKey(key, amount){
  const [year,month,day] = key.split("-").map(Number);
  const value = new Date(Date.UTC(year, month - 1, day + amount));
  return value.toISOString().slice(0,10);
}

function dayStartMs(key){
  return Date.parse(`${key}T00:00:00${CHINA_OFFSET}`);
}

function monthKeys(count){
  const p = chinaParts(new Date());
  const result = [];
  for(let offset = count - 1; offset >= 0; offset--){
    const value = new Date(Date.UTC(
      Number(p.year),
      Number(p.month) - 1 - offset,
      1
    ));
    result.push(value.toISOString().slice(0,7));
  }
  return result;
}

function lastDayKeys(count, endKey=dayKey(new Date())){
  const result = [];
  for(let offset = count - 1; offset >= 0; offset--){
    result.push(addDaysToKey(endKey, -offset));
  }
  return result;
}

function daysInMonth(key){
  const [year,month] = key.split("-").map(Number);
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

function splitIntervalByDay(startMs, endMs, amount){
  if(!(endMs > startMs) || !(amount > 0)) return [];
  const totalMs = endMs - startMs;
  const result = [];
  let cursor = startMs;

  while(cursor < endMs){
    const key = dayKey(cursor);
    const nextBoundary = dayStartMs(addDaysToKey(key, 1));
    const segmentEnd = Math.min(endMs, nextBoundary);
    result.push({
      key,
      value: amount * (segmentEnd - cursor) / totalMs
    });
    cursor = segmentEnd;
  }
  return result;
}

function ensureDay(target, key){
  if(!target[key]){
    target[key] = {usage:0,recharge:0,coverageHours:0};
  }
  return target[key];
}

function cleanRows(rows){
  const byId = new Map();

  for(const row of rows){
    const timestamp = new Date(row.created_at).getTime();
    const balance = Number(row.balance);
    if(!Number.isFinite(timestamp) || !Number.isFinite(balance) || balance < 0){
      continue;
    }
    const normalized = {
      id:row.id,
      created_at:new Date(timestamp).toISOString(),
      balance
    };
    const key = row.id == null
      ? `${normalized.created_at}|${normalized.balance}`
      : String(row.id);
    byId.set(key, normalized);
  }

  return [...byId.values()].sort(
    (a,b) => new Date(a.created_at) - new Date(b.created_at)
  );
}

function analyze(rows){
  const byDay = {};
  const activities = [];
  let longGapCount = 0;
  let rechargeIntervalCount = 0;
  const confirmations = loadRechargeConfirmations();
  const unconfirmedRecharges = [];

  for(let index = 1; index < rows.length; index++){
    const previous = rows[index - 1];
    const current = rows[index];
    const startMs = new Date(previous.created_at).getTime();
    const endMs = new Date(current.created_at).getTime();
    if(!(endMs > startMs)) continue;

    const gapHours = (endMs - startMs) / 3600000;
    if(gapHours > NORMAL_GAP_HOURS) longGapCount++;

    if(gapHours <= NORMAL_GAP_HOURS){
      for(const part of splitIntervalByDay(startMs,endMs,gapHours)){
        ensureDay(byDay,part.key).coverageHours += part.value;
      }
    }

    const netChange = current.balance - previous.balance;
    const key = intervalKey(previous,current);

    if(netChange > BALANCE_EPSILON){
      const saved = confirmations[key];
      if(saved && Number(saved.amount) > 0){
        const rechargeAmount = Number(saved.amount);
        const usage = Math.max(
          0,
          previous.balance + rechargeAmount - current.balance
        );

        const rechargeDay = dayKey(current.created_at);
        ensureDay(byDay,rechargeDay).recharge += rechargeAmount;
        rechargeIntervalCount++;

        activities.push({
          type:"recharge",
          source:"confirmed",
          time:current.created_at,
          amount:rechargeAmount,
          fromBalance:previous.balance,
          toBalance:current.balance,
          gapHours
        });

        if(usage > BALANCE_EPSILON){
          for(const part of splitIntervalByDay(startMs,endMs,usage)){
            ensureDay(byDay,part.key).usage += part.value;
          }
          activities.push({
            type:"usage",
            source:"adjusted",
            time:current.created_at,
            amount:usage,
            fromBalance:previous.balance,
            toBalance:current.balance,
            rechargeAmount,
            gapHours
          });
        }
      }else{
        // 未确认前，暂时按余额净增加额作为充值估计，但不把它算成“已确认充值”。
        const inferred = netChange;
        const rechargeDay = dayKey(current.created_at);
        ensureDay(byDay,rechargeDay).recharge += inferred;

        activities.push({
          type:"recharge",
          source:"unconfirmed",
          time:current.created_at,
          amount:inferred,
          fromBalance:previous.balance,
          toBalance:current.balance,
          gapHours
        });

        unconfirmedRecharges.push({
          key,
          previous,
          current,
          inferred
        });
      }
      continue;
    }

    const usage = previous.balance - current.balance;
    if(usage > BALANCE_EPSILON){
      for(const part of splitIntervalByDay(startMs,endMs,usage)){
        ensureDay(byDay,part.key).usage += part.value;
      }
      activities.push({
        type:"usage",
        source:"balance",
        time:current.created_at,
        amount:usage,
        fromBalance:previous.balance,
        toBalance:current.balance,
        gapHours
      });
    }
  }

  const months = {};
  for(const [key,value] of Object.entries(byDay)){
    const month = key.slice(0,7);
    if(!months[month]) months[month] = {usage:0,recharge:0};
    months[month].usage += value.usage;
    months[month].recharge += value.recharge;
  }

  const today = dayKey(new Date());
  const yesterday = addDaysToKey(today,-1);
  const currentMonth = today.slice(0,7);
  const averageCandidates = lastDayKeys(21,yesterday)
    .map(key => ({key,...(byDay[key] || {usage:0,recharge:0,coverageHours:0})}))
    .filter(item => item.coverageHours >= 18)
    .slice(-7);

  const fallbackCandidates = averageCandidates.length
    ? averageCandidates
    : lastDayKeys(7,yesterday)
        .map(key => ({key,...(byDay[key] || {usage:0,recharge:0,coverageHours:0})}))
        .filter(item => item.coverageHours > 0);

  const averageDaily = fallbackCandidates.length
    ? fallbackCandidates.reduce((sum,item) => sum + item.usage,0) / fallbackCandidates.length
    : 0;

  const latest = rows.at(-1);
  const currentMonthUsage = months[currentMonth]?.usage || 0;
  const todayOfMonth = Number(today.slice(-2));
  const remainingCalendarDays = Math.max(
    0,
    daysInMonth(currentMonth) - todayOfMonth
  );
  const projectedMonth =
    currentMonthUsage + averageDaily * remainingCalendarDays;

  const remainingDays = latest && averageDaily > BALANCE_EPSILON
    ? latest.balance / averageDaily
    : null;

  return {
    byDay,
    months,
    activities,
    longGapCount,
    rechargeIntervalCount,
    unconfirmedRecharges,
    todayUsage:byDay[today]?.usage || 0,
    yesterdayUsage:byDay[yesterday]?.usage || 0,
    monthUsage:currentMonthUsage,
    monthRecharge:months[currentMonth]?.recharge || 0,
    averageDaily,
    projectedMonth,
    remainingDays,
    averageDayCount:fallbackCandidates.length
  };
}

async function supabaseRequest(params){
  const url = new URL(`${SUPABASE_URL}/rest/v1/electricity`);
  for(const [key,value] of Object.entries(params)){
    url.searchParams.set(key, value);
  }

  const response = await fetch(url, {
    cache:"no-store",
    headers:{
      apikey:SUPABASE_PUBLIC_KEY,
      Authorization:`Bearer ${SUPABASE_PUBLIC_KEY}`
    }
  });

  if(!response.ok){
    const message = await response.text();
    throw new Error(`Supabase 读取失败：HTTP ${response.status}\n${message}`);
  }
  return response.json();
}

async function loadData(){
  if(!SUPABASE_URL.startsWith("https://")){
    throw new Error("请填写正确的 SUPABASE_URL。");
  }
  if(!SUPABASE_PUBLIC_KEY || /service_role|sb_secret_/i.test(SUPABASE_PUBLIC_KEY)){
    throw new Error("网页只能使用 Supabase publishable/anon key，不能使用 service_role 或 secret key。");
  }

  const firstMonth = monthKeys(12)[0];
  const windowStart = `${firstMonth}-01`;
  const startIso = new Date(dayStartMs(windowStart)).toISOString();

  const anchorPromise = supabaseRequest({
    select:"id,created_at,balance",
    created_at:`lt.${startIso}`,
    order:"created_at.desc,id.desc",
    limit:"1"
  });

  const firstPagePromise = supabaseRequest({
    select:"id,created_at,balance",
    created_at:`gte.${startIso}`,
    order:"created_at.asc,id.asc",
    limit:String(PAGE_SIZE),
    offset:"0"
  });

  const [anchor,firstPage] = await Promise.all([
    anchorPromise,
    firstPagePromise
  ]);
  const collected = [...anchor,...firstPage];
  let page = firstPage;
  let pageNumber = 1;

  while(page.length === PAGE_SIZE && pageNumber < MAX_PAGES){
    page = await supabaseRequest({
      select:"id,created_at,balance",
      created_at:`gte.${startIso}`,
      order:"created_at.asc,id.asc",
      limit:String(PAGE_SIZE),
      offset:String(pageNumber * PAGE_SIZE)
    });
    collected.push(...page);
    pageNumber++;
  }

  const rows = cleanRows(collected);
  if(!rows.length){
    throw new Error("Supabase electricity 表中还没有可用数据。");
  }
  if(page.length === PAGE_SIZE && pageNumber >= MAX_PAGES){
    throw new Error("半年数据超过当前 10000 条读取上限，请提高 MAX_PAGES。");
  }
  return rows;
}

function renderUsageCalendar(analysis, month){
  const grid = $("usageCalendar");

  const days = new Date(year, mon, 0).getDate();
  const firstWeekday = new Date(year, mon - 1, 1).getDay();
  const values = [];
  for(let d=1; d<=days; d++){
    const key = `${year}-${String(mon).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    values.push({d,key,usage:analysis.byDay[key]?.usage || 0});
  }
  const positive = values.filter(v => v.usage > BALANCE_EPSILON);
  const maxUsage = positive.length ? Math.max(...positive.map(v=>v.usage)) : null;
  const minUsage = positive.length ? Math.min(...positive.map(v=>v.usage)) : null;
  const today = dayKey(new Date());
  const blanks = Array.from({length:firstWeekday},()=>'<div class="cal-empty"></div>').join("");
  const cells = values.map(v=>{
    const isMax = maxUsage != null && Math.abs(v.usage-maxUsage) < 1e-9;

    const isToday = v.key === today;
    const cls = ["cal-day",isMax?"max":"",isMin?"min":"",isToday?"today":""].filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-day="${v.key}" data-usage="${v.usage}" title="${v.key} · ${money(v.usage)} 元">
      <span class="cal-num">${v.d}</span>

  }).join("");
  grid.innerHTML = blanks + cells;

  grid.querySelectorAll(".cal-day").forEach(cell=>{
    cell.addEventListener("click",()=>{
      const yuan = Number(cell.dataset.usage || 0);
      showToast(`${cell.dataset.day} · 用电 ${money(yuan)} 元`);
    });
  });

  const totalYuan = analysis.months[month]?.usage || 0;
  const usedDays = values.filter(v => v.usage > BALANCE_EPSILON);
  const averageYuan = usedDays.length
    ? usedDays.reduce((sum,v)=>sum + v.usage,0) / usedDays.length
    : 0;

  $("selectedMonthUsageYuan").textContent = money(totalYuan);
  $("selectedMonthAverageYuan").textContent = money(averageYuan);
}

function renderDailyMonthTrend(analysis, month){
  if(!$("schoolDailyChart") || typeof Chart === "undefined") return;
  const [year,mon] = month.split("-").map(Number);
  const days = new Date(year,mon,0).getDate();
  const keys = Array.from({length:days},(_,i)=>`${year}-${String(mon).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`);
  schoolDailyChart?.destroy();
  schoolDailyChart = new Chart($("schoolDailyChart"),{
    type:"line",
    data:{
      labels:keys.map(k=>k.slice(5).replace("-","/")),
      datasets:[{
        data:keys.map(k=>analysis.byDay[k]?.usage || 0),
        borderColor:"#20aaa8",
        backgroundColor:"rgba(32,170,168,.10)",
        fill:true,
        tension:.28,
        pointRadius:3,
        pointHoverRadius:5,
        borderWidth:2
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${money(c.raw)} 元`}}},
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:9,color:"#81868f"}},
        y:{beginAtZero:true,grid:{color:"rgba(24,33,43,.09)"},ticks:{color:"#81868f"}}
      }
    }
  });
}

function renderYearPanel(analysis, year){
  const yearNum = Number(year);
  const monthKeysForYear = Array.from({length:12},(_,i)=>`${yearNum}-${String(i+1).padStart(2,"0")}`);
  schoolYearChart?.destroy();
  if($("schoolYearChart") && typeof Chart !== "undefined"){
    schoolYearChart = new Chart($("schoolYearChart"),{
      type:"bar",
      data:{
        labels:monthKeysForYear.map((_,i)=>`${i+1}月`),
        datasets:[{
          data:monthKeysForYear.map(k=>analysis.months[k]?.usage || 0),
          backgroundColor:"rgba(28,193,165,.90)",
          hoverBackgroundColor:"#19aa9f",
          borderRadius:2,
          maxBarThickness:30
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${money(c.raw)} 元`}}},
        scales:{
          x:{grid:{display:false},ticks:{color:"#555"}},
          y:{beginAtZero:true,grid:{color:"rgba(24,33,43,.12)"},ticks:{color:"#666"}}
        }
      }
    });
  }
  const list = $("monthBillList");
  if(list){
    const cards = monthKeysForYear.slice().reverse().filter(k => (analysis.months[k]?.usage || 0) > BALANCE_EPSILON);
    list.innerHTML = cards.length ? cards.map(k=>{
      const yuan = analysis.months[k]?.usage || 0;
      return `<div class="bill-card">
        <div class="bill-month">${monthLabel(k)}</div>
        <div class="bill-values">
          <div><b>${money(yuan)}</b><span class="bill-label">用电（元）</span></div>
          <div><b>${money(analysis.months[k]?.recharge || 0)}</b><span class="bill-label">充值（元）</span></div>
        </div>
      </div>`;
    }).join("") : '<div class="empty">该年份暂无采集数据</div>';
  }
}

function renderSchoolStyle(analysis, rows){
  const latest = rows.at(-1);
  $("schoolBalance").textContent = money(latest.balance);
  $("schoolUpdated").textContent = `最近采集 ${cnTime(latest.created_at,true)}`;

  const alert = $("schoolAlert");
  if(latest.balance < 1){
    alert.classList.remove("hidden");
    alert.textContent = "余额不足 1 元，已进入邮箱提醒范围";
  }else{
    alert.classList.add("hidden");
    alert.textContent = "";
  }

  const availableMonths = getAvailableMonths(analysis);
  const current = monthKey(new Date());

  if(!selectedUsageMonth || !availableMonths.includes(selectedUsageMonth)){
    selectedUsageMonth = availableMonths.includes(current)
      ? current
      : (availableMonths.at(-1) || current);
  }

  const monthPicker = $("monthPicker");
  monthPicker.innerHTML = (availableMonths.length ? availableMonths : [selectedUsageMonth])
    .slice()
    .reverse()
    .map(key => `<option value="${key}">${monthLabel(key)}</option>`)
    .join("");
  monthPicker.value = selectedUsageMonth;

  renderUsageCalendar(analysis,selectedUsageMonth);
  renderDailyMonthTrend(analysis,selectedUsageMonth);

  const years = [...new Set(
    (availableMonths.length ? availableMonths : [current]).map(k=>k.slice(0,4))
  )].sort().reverse();

  if(!selectedUsageYear || !years.includes(String(selectedUsageYear))){
    selectedUsageYear = years[0] || String(new Date().getFullYear());
  }

  const yearPicker = $("yearPicker");
  yearPicker.innerHTML = years
    .map(y=>`<option value="${y}">${y}年</option>`)
    .join("");
  yearPicker.value = String(selectedUsageYear);

  renderYearPanel(analysis,selectedUsageYear);
}

function render(rows){
  currentRows = rows;
  currentAnalysis = analyze(rows);
  const a = currentAnalysis;
  const latest = rows.at(-1);

  const latestAgeMinutes = Math.max(
    0,
    Math.floor((Date.now() - new Date(latest.created_at).getTime()) / 60000)
  );

  $("remainingDays").textContent = a.remainingDays == null
    ? "--"
    : a.remainingDays.toFixed(1);
  $("averageDaily").textContent = money(a.averageDaily);
  $("monthRecharge").textContent = money(a.monthRecharge);
  $("projectedMonth").textContent = money(a.projectedMonth);

  if(latestAgeMinutes > 90){
    setStatus("数据较旧","warning");
  }else{
    setStatus("数据正常");
  }

  // 普通统计提示不再占据页面；读取/网络错误仍通过 notice 显示。
  showNotice("");

  if(a.unconfirmedRecharges.length > 0 && !$("rechargeModal").classList.contains("show")){
    openRechargePrompt(a.unconfirmedRecharges[0]);
  }

  renderSchoolStyle(a,rows);
  renderCharts(rows,a);
  renderActivities(a.activities);
}

async function refresh(showSuccess=false){
  if(refreshing) return;
  refreshing = true;
  const button = $("refreshBtn");
  button.disabled = true;
  button.textContent = "读取中…";
  setStatus("正在读取","loading");

  try{
    const rows = await loadData();
    render(rows);
    if(showSuccess) showToast(`刷新成功，当前余额 ${money(rows.at(-1).balance)} 元`);
  }catch(error){
    console.error(error);
    setStatus("读取失败","error");
    showNotice(error.message,"error");
    if(showSuccess) showToast(error.message,true);
  }finally{
    refreshing = false;
    button.disabled = false;
    button.textContent = "刷新数据";
  }
}

function exportCsv(){
  if(!currentRows.length){
    showToast("当前没有可导出的数据",true);
    return;
  }
  const lines = [
    ["id","created_at_utc","beijing_time","balance"],
    ...currentRows.map(row => [
      row.id ?? "",
      row.created_at,
      cnTime(row.created_at,true),
      row.balance.toFixed(2)
    ])
  ];
  const csv = "\uFEFF" + lines.map(
    line => line.map(value => `"${String(value).replaceAll('"','""')}"`).join(",")
  ).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `electricity_${dayKey(new Date())}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}


function openRechargePrompt(item){
  pendingRechargeInterval = item;
  $("rechargePrompt").textContent =
    `检测到 ${cnTime(item.current.created_at,true)} 余额从 `
    + `${money(item.previous.balance)} 元上升到 ${money(item.current.balance)} 元。`
    + ` 余额净增加 ${money(item.inferred)} 元。请输入这次实际充值金额，`
    + `系统将重新计算该区间真实用电。`;
  $("rechargeAmount").value = "";
  $("rechargeModal").classList.add("show");
  $("rechargeModal").setAttribute("aria-hidden","false");
  setTimeout(() => $("rechargeAmount").focus(),0);
}

function closeRechargePrompt(){
  $("rechargeModal").classList.remove("show");
  $("rechargeModal").setAttribute("aria-hidden","true");
  pendingRechargeInterval = null;
}

function confirmRechargeAmount(){
  if(!pendingRechargeInterval) return;
  const amount = Number($("rechargeAmount").value);

  if(!Number.isFinite(amount) || amount <= 0 || amount > 10000){
    showToast("请输入正确的实际充值金额",true);
    return;
  }

  const minimum = pendingRechargeInterval.current.balance
    - pendingRechargeInterval.previous.balance;

  if(amount + BALANCE_EPSILON < minimum){
    showToast(
      `充值金额不能小于余额净增加 ${money(minimum)} 元，否则无法解释当前余额。`,
      true
    );
    return;
  }

  const confirmations = loadRechargeConfirmations();
  confirmations[pendingRechargeInterval.key] = {
    amount:Number(amount.toFixed(2)),
    confirmed_at:new Date().toISOString()
  };
  saveRechargeConfirmations(confirmations);

  const correctedUsage =
    pendingRechargeInterval.previous.balance
    + amount
    - pendingRechargeInterval.current.balance;

  closeRechargePrompt();
  showToast(
    `已确认充值 ${money(amount)} 元，校正该区间用电 ${money(correctedUsage)} 元`
  );

  if(currentRows.length){
    render(currentRows);
  }
}

$("saveRechargeBtn").addEventListener("click",confirmRechargeAmount);
$("skipRechargeBtn").addEventListener("click",closeRechargePrompt);

$("refreshBtn").addEventListener("click",() => refresh(true));
$("exportBtn").addEventListener("click",exportCsv);

document.querySelectorAll(".tab[data-days]").forEach(button=>{
  button.addEventListener("click",()=>{

window.addEventListener("online",() => refresh(false));
window.addEventListener("offline",() => {
  setStatus("网络已断开","error");
  showNotice("当前设备已离线，恢复网络后会自动重新读取。","error");
});

refresh(false);
setInterval(() => refresh(false),AUTO_REFRESH_MS);
